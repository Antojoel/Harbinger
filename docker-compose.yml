services:
  # 1. Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: harbinger-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Core Python FastAPI Engine
  engine:
    build:
      context: ./services/engine
      dockerfile: Dockerfile
    container_name: harbinger-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persists user_store.py's login/onboarding-seen state across
      # container restarts/rebuilds - without this, every rebuild wiped
      # it, logging everyone out and re-showing onboarding to existing
      # accounts (it's a plain in-memory dict otherwise, not a database).
      - engine_data:/data
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - RAZORPAY_KEY=${RAZORPAY_KEY:-}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Voice pipeline (POST /api/voice-query). One of:
      #   text_only (default, no speech infra) | openai | gemini | vertex | local
      - VOICE_PROVIDER=${VOICE_PROVIDER:-text_only}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_SERVICE_ACCOUNT_JSON_B64=${GOOGLE_SERVICE_ACCOUNT_JSON_B64:-}
      - VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID:-}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - VERTEX_STT_MODEL=${VERTEX_STT_MODEL:-gemini-2.5-flash}
      - VERTEX_TTS_VOICE=${VERTEX_TTS_VOICE:-en-US-Neural2-C}
      # Synthesis-only override, independent of VOICE_PROVIDER above:
      #   smallest | openai | gemini | vertex | local | text_only
      # Unset (default) = speak with VOICE_PROVIDER, exactly as before.
      # TTS_PROVIDER=smallest uses Smallest AI Waves (Lightning) - no GPU,
      # no local tts container needed for the speaking half.
      - TTS_PROVIDER=${TTS_PROVIDER:-}
      - SMALLEST_AI_KEY=${SMALLEST_AI_KEY:-}
      - SMALLEST_TTS_MODEL=${SMALLEST_TTS_MODEL:-lightning_v3.1}
      - SMALLEST_TTS_VOICE=${SMALLEST_TTS_VOICE:-srishti}
      - SMALLEST_TTS_LANGUAGE=${SMALLEST_TTS_LANGUAGE:-en}
      - SMALLEST_TTS_SAMPLE_RATE=${SMALLEST_TTS_SAMPLE_RATE:-24000}
      - SMALLEST_TTS_SPEED=${SMALLEST_TTS_SPEED:-1.0}
      # Answer wording (response_text): heuristic (default, no LLM) | openai | gemini
      - LLM_ANSWER_PROVIDER=${LLM_ANSWER_PROVIDER:-heuristic}
      - LLM_ANSWER_MODEL=${LLM_ANSWER_MODEL:-}
      - STT_URL=http://stt:8100
      - TTS_URL=http://tts:8200
    depends_on:
      neo4j:
        condition: service_healthy

  # 2b. Speech-to-text — OPT-IN ONLY (profile "voice-local"). The default
  #     voice path (VOICE_PROVIDER=text_only, and the dashboard's own
  #     VoiceWidget which uses the browser's Web Speech API) needs neither
  #     this nor `tts` at all. Bring these up explicitly with:
  #       docker compose --profile voice-local up
  #     Both auto-detect CPU vs GPU internally (STT_DEVICE=auto /
  #     KOKORO_DEVICE=auto) - CPU by default here so `docker compose up`
  #     never depends on a GPU that may not exist. On a real GPU host with
  #     nvidia-container-toolkit, uncomment the `deploy` block below (or set
  #     it in a docker-compose.override.yml) and pass
  #     TORCH_INDEX_URL=https://download.pytorch.org/whl/cu126 for tts.
  stt:
    profiles: ["voice-local"]
    build:
      context: ./services/stt
      dockerfile: Dockerfile
    container_name: harbinger-stt
    ports:
      - "8100:8100"
    environment:
      - STT_ENGINE=${STT_ENGINE:-faster_whisper}
      - STT_WHISPER_MODEL=${STT_WHISPER_MODEL:-small.en}
      - STT_DEVICE=${STT_DEVICE:-auto}
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-auto}
      - STT_LANGUAGE=${STT_LANGUAGE:-en}
      # only used when STT_ENGINE=sherpa:
      - STT_HF_REPO=${STT_HF_REPO:-csukuangfj/sherpa-onnx-streaming-zipformer-en-2023-06-26}
      - STT_HF_TOKEN=${STT_HF_TOKEN:-}
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  # 2c. Text-to-speech (Kokoro-82M) — OPT-IN ONLY (profile "voice-local"),
  #     same reasoning as stt above. CPU torch wheel by default (matches the
  #     Dockerfile's own ARG default); pass TORCH_INDEX_URL for a CUDA build.
  tts:
    profiles: ["voice-local"]
    build:
      context: ./services/tts
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: harbinger-tts
    ports:
      - "8200:8200"
    environment:
      - KOKORO_DEVICE=${KOKORO_DEVICE:-auto}
      - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
    volumes:
      - tts-models:/models

  # 3. Model Context Protocol (MCP) Server Adapter
  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    container_name: harbinger-mcp-server
    restart: unless-stopped
    ports:
      - "9000:9000" # MCP streamable-http endpoint at /mcp
    environment:
      - ENGINE_URL=http://engine:8000
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
    depends_on:
      - engine

  # 4. React (Vite) + Tailwind Web App — ported from the Emergent-generated
  # ClearanceGuard dashboard, migrated off CRA/craco to Vite, rewired to call
  # the real engine (see routes.py's UI-adapter endpoints and
  # app/core/shipment_store.py)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: harbinger-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      - engine

volumes:
  neo4j_data:
  tts-models:
  engine_data:
