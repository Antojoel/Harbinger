services:
  # 1. Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: harbinger-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Core Python FastAPI Engine
  engine:
    build:
      context: ./services/engine
      dockerfile: Dockerfile
    container_name: harbinger-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - RAZORPAY_KEY=${RAZORPAY_KEY:-}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Voice pipeline (POST /api/voice-query). One of:
      #   text_only (default, no speech infra) | openai | gemini | local
      - VOICE_PROVIDER=${VOICE_PROVIDER:-text_only}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - STT_URL=http://stt:8100
      - TTS_URL=http://tts:8200
    depends_on:
      neo4j:
        condition: service_healthy

  # 2b. Speech-to-text. Default engine: faster-whisper (Whisper on CTranslate2),
  #     CUDA-accelerated when a GPU is visible. Weights are baked into the image.
  #     Set STT_ENGINE=sherpa for the lighter streaming Zipformer / Kroko model.
  #     `gpus: all` needs nvidia-container-toolkit on the host; on a CPU-only
  #     box drop that block and the engine falls back to CPU int8.
  stt:
    build:
      context: ./services/stt
      dockerfile: Dockerfile
    container_name: harbinger-stt
    ports:
      - "8100:8100"
    environment:
      - STT_ENGINE=${STT_ENGINE:-faster_whisper}
      - STT_WHISPER_MODEL=${STT_WHISPER_MODEL:-small.en}
      - STT_DEVICE=${STT_DEVICE:-auto}
      - STT_COMPUTE_TYPE=${STT_COMPUTE_TYPE:-auto}
      - STT_LANGUAGE=${STT_LANGUAGE:-en}
      # only used when STT_ENGINE=sherpa:
      - STT_HF_REPO=${STT_HF_REPO:-csukuangfj/sherpa-onnx-streaming-zipformer-en-2023-06-26}
      - STT_HF_TOKEN=${STT_HF_TOKEN:-}
    gpus: all

  # 2c. Text-to-speech (Kokoro-82M). Runs on CUDA when the image is built with a
  #     CUDA torch wheel (TORCH_INDEX_URL) and the container gets a GPU.
  tts:
    build:
      context: ./services/tts
      dockerfile: Dockerfile
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    container_name: harbinger-tts
    ports:
      - "8200:8200"
    environment:
      - KOKORO_DEVICE=${KOKORO_DEVICE:-auto}
      - KOKORO_VOICE=${KOKORO_VOICE:-af_heart}
    gpus: all
    volumes:
      - tts-models:/models

  # 3. Model Context Protocol (MCP) Server Adapter
  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    container_name: harbinger-mcp-server
    restart: unless-stopped
    ports:
      - "9000:9000" # MCP streamable-http endpoint at /mcp
    environment:
      - ENGINE_URL=http://engine:8000
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
    depends_on:
      - engine

  # 4. React (Vite) + Tailwind Web App — ported from the Emergent-generated
  # ClearanceGuard dashboard, migrated off CRA/craco to Vite, rewired to call
  # the real engine (see routes.py's UI-adapter endpoints and
  # app/core/shipment_store.py)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: harbinger-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      - engine

volumes:
  neo4j_data:
  tts-models:
