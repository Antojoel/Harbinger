services:
  # 1. Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: harbinger-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Core Python FastAPI Engine
  engine:
    build:
      context: ./services/engine
      dockerfile: Dockerfile
    container_name: harbinger-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - RAZORPAY_KEY=${RAZORPAY_KEY:-}
      - RAZORPAY_SECRET=${RAZORPAY_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
    depends_on:
      neo4j:
        condition: service_healthy

  # 3. Model Context Protocol (MCP) Server Adapter
  mcp-server:
    build:
      context: ./services/mcp-server
      dockerfile: Dockerfile
    container_name: harbinger-mcp-server
    restart: unless-stopped
    ports:
      - "9000:9000" # MCP streamable-http endpoint at /mcp
    environment:
      - ENGINE_URL=http://engine:8000
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
    depends_on:
      - engine

  # 4. React (Vite) + Tailwind Web App — ported from the Emergent-generated
  # ClearanceGuard dashboard, migrated off CRA/craco to Vite, rewired to call
  # the real engine (see routes.py's UI-adapter endpoints and
  # app/core/shipment_store.py)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: harbinger-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
      - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      - engine

volumes:
  neo4j_data:
